def androidHome = System.getenv('ANDROID_HOME')
def androidJar = "${androidHome}/platforms/android-35/android.jar"

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
    // core-lambda-stubs provides the lambda bootstrap classes that android.jar leaves out.
    options.bootstrapClasspath = files(androidJar, "${androidHome}/build-tools/35.0.0/core-lambda-stubs.jar")
}

dependencies {
    compileOnly files(androidJar)
    implementation project(':runtime-core')
}

jar {
    archiveFileName = 'kata-rt-android.jar'
}
